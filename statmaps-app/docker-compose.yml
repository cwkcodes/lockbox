services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: statmaps
      POSTGRES_DB: statmaps
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5544:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  api:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./api:/app
    command: sh -c "npm install && npm run start"
    environment:
      DATABASE_URL: postgres://statmaps@db:5432/statmaps
      PORT: "8787"
    ports:
      - "8787:8787"
    depends_on:
      - db

volumes:
  pgdata:
